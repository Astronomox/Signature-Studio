<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create professional digital signatures with ease using our advanced drawing tools and customization options." />
    <meta name="theme-color" content="#0f172a" />
    <title>Signature Studio Pro - Digital Signature Creator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Pacifico&family=Sacramento&family=Caveat:wght@400;700&family=Homemade+Apple&family=Monsieur+La+Doulaise&family=Inter:wght@300;400;500;600;700&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        overflow: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: #475569 #1e293b;
      }
      
      /* Loading state */
      #root:empty::before {
        content: 'Loading Signature Studio...';
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #94a3b8;
        font-size: 1.25rem;
        font-weight: 600;
      }
      
      /* Tailwind animations */
      @keyframes slideInFromLeft {
        from {
          opacity: 0;
          transform: translateX(-1rem);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      .animate-in {
        animation: slideInFromLeft 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
